name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=app --cov=database --cov=tools --cov=main --cov=worker --cov=security --cov=settings --cov=models --cov=mailer --cov-fail-under=85 --cov-report=term-missing
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
      - run: docker build -t waypoint:ci .
      - run: cp .env.production.example .env.production
      - run: docker compose --env-file .env.production.example config --quiet
