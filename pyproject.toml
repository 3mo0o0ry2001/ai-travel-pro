[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 110
exclude = ["venv", ".venv", ".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.extend-per-file-ignores]
"app.py" = ["B008"] # FastAPI evaluates dependency declarations at application construction.
