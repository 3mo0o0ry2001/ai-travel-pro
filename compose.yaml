services:
  web:
    build: .
    env_file: .env.production
    restart: unless-stopped
    volumes: [travel_data:/app/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512M
  worker:
    build: .
    env_file: .env.production
    command: [python, worker.py]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, scripts/worker_health.py]
      interval: 30s
      timeout: 5s
      start_period: 30s
    volumes: [travel_data:/app/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 256M
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks: [internal]
networks:
  internal:
volumes:
  travel_data:
  caddy_data:
  caddy_config:
